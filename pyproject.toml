[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msv"
version = "0.1.0"
description = "TESS variability pipeline for massive stars: cleaning, LS+ACF peak detection, CNN+BRF classification"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "astropy",
    "statsmodels",
    "pyarrow",
]

[project.optional-dependencies]
ray = ["ray"]
tf = ["tensorflow"]
brf = ["scikit-learn", "imbalanced-learn", "joblib"]
acf-fill = ["astrobase"]

[tool.setuptools.packages.find]
where = ["src"]
